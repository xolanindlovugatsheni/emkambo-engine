# Emkambo run configuration. Paths are relative to this file.
output_dir: runs

data:
  commodity: maize
  trades: data/trades.csv        # columns: date, commodity, quantity_t, price, currency
  fx:                            # optional: date, zig_per_usd (needed to use ZiG trades)

model:
  harmonics: 2                   # annual Fourier harmonics in the seasonal curve

haircut:
  alpha: 0.99                    # expected-shortfall confidence level
  tenors_days: [30, 60, 90, 180]
  liquidation_lag_days: 21       # to be replaced with observed bank recovery times
  storage_usd_per_t_day: 0.10    # from ZMX warehouse tariffs
  seasonal_mode: adverse         # full | adverse | none
  floor:                         # GMB floor producer price (maize only; keep disabled for soya)
    enabled: false
    price_usd_per_t: 364.75      # 2025/26 floor producer price
    zig_share: 0.5               # ASSUMPTION: share paid in ZiG; confirm with GMB/lenders
    zig_market_discount: 0.10    # ASSUMPTION: interbank vs market rate gap
    zig_depreciation_annual: 0.20  # ASSUMPTION
    zig_vol_annual: 0.25         # ASSUMPTION
    payment_delay_days: 45       # ASSUMPTION: delivery to payment
    funding_rate_annual: 0.15    # ASSUMPTION: lender USD funding rate
    delivery_cost_usd_per_t: 10.0  # ASSUMPTION: transport and handling to depot
    p_fail: 0.20                 # ASSUMPTION: probability GMB does not buy or pay; run a range

monte_carlo:
  batches: 40
  paths_per_batch: 25000
  bias: 4.0                      # regime biasing into stress (1 = off)
  tilt: 0.75                     # shock tilting toward losses, in standard deviations (0 = off)
  param_uncertainty: true        # propagate calibration covariance into the haircut
  seed: 20261018

backtest:
  alpha: 0.95                    # lower level so a short history still has exceedances to count
  tenor_days: 60
  min_train_days: 730
  recal_every: 4
  paths: 40000
  seed: 7
