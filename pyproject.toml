[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emkambo"
version = "0.1.0"
description = "Collateral haircut engine for warehouse-receipt lending (Mveli Labs)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
emkambo = "emkambo.cli:main"

[tool.setuptools]
packages = ["emkambo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running statistical tests"]
